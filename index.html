<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schichtplan Getränke</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Schichtplan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d5a6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: Kopfleiste mit KW-Navigation, Tabs, darunter Plan-Raster (Mitarbeiter × Mo–Sa) mit Besetzungsbalken je Tag */
:root{
  --bg:#f3f5f3; --surface:#ffffff; --surface-2:#e9edea; --line:#d3dad5;
  --ink:#18221d; --muted:#5d6a63;
  --accent:#1d5a6e; --accent-ink:#ffffff; --accent-soft:#dcebef;
  --ok:#2c7a46; --ok-soft:#dff0e3;
  --warn:#a66a00; --warn-soft:#fbefd4;
  --bad:#b8372a; --bad-soft:#f9e0dc;
  --holiday:#6b4fa0; --holiday-soft:#ece6f6; --fer:#9a3570; --fer-soft:#f7e1ee;
  --chip-l:44%; --chip-bg-l:93%; --chip-s:52%;
  --f-display:"Avenir Next Condensed","Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --surface-2:#222c27; --line:#33403a;
  --ink:#e6ece8; --muted:#9aa8a0;
  --accent:#6fb4c9; --accent-ink:#0d1a1f; --accent-soft:#1d343c;
  --ok:#6cc58a; --ok-soft:#1b3424; --warn:#e2ad4a; --warn-soft:#3a2d12;
  --bad:#f08374; --bad-soft:#41201b; --holiday:#b9a3e6; --holiday-soft:#2c2540; --fer:#ec9ccb; --fer-soft:#3d1b2f;
  --chip-l:76%; --chip-bg-l:22%; --chip-s:40%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --surface-2:#222c27; --line:#33403a;
  --ink:#e6ece8; --muted:#9aa8a0;
  --accent:#6fb4c9; --accent-ink:#0d1a1f; --accent-soft:#1d343c;
  --ok:#6cc58a; --ok-soft:#1b3424; --warn:#e2ad4a; --warn-soft:#3a2d12;
  --bad:#f08374; --bad-soft:#41201b; --holiday:#b9a3e6; --holiday-soft:#2c2540; --fer:#ec9ccb; --fer-soft:#3d1b2f;
  --chip-l:76%; --chip-bg-l:22%; --chip-s:40%; color-scheme:dark}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:30px;line-height:1}
h2{font-size:22px}
h3{font-size:18px}
.mono,.t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:default}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px;min-width:0}
textarea{width:100%;min-height:70px;resize:vertical}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px;padding-bottom:14px;border-bottom:2px solid var(--ink)}
.brand .lbl{display:block;margin-bottom:4px}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.kw{font-family:var(--f-display);font-size:24px;font-weight:700;min-width:84px;text-align:center}
.range{font-size:13px;color:var(--muted);min-width:140px}
.tabs{display:flex;gap:4px;margin:14px 0 18px;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:var(--r);font-weight:600;color:var(--muted)}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
.notice{padding:10px 12px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);margin-bottom:14px;font-size:14px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .spacer{flex:1}
.status{font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.hol{background:var(--holiday-soft);color:var(--holiday)}
.pill.fer{background:var(--fer-soft);color:var(--fer)}
.wt{width:100%;border-collapse:collapse;font-size:14px}.wt th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}.wt td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line)}
.sks{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px}.sk{font-size:11px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted);white-space:nowrap}
.totrow td{background:var(--surface-2);height:auto!important}
.wt tfoot td{font-weight:700;border-bottom:0}
.copyp label span{display:grid;justify-items:center;line-height:1.2;min-width:44px}
.copyp small{font-weight:400;font-size:10px}
.copyp input:disabled+span{opacity:.4}
.seg{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.seg .tab{border:0;padding:6px 12px;border-radius:6px}
.seg .tab[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.ptop .seg{margin-bottom:0}
table.ovt{border-collapse:collapse;width:100%;min-width:1080px;font-size:14px}
.ovt th{background:var(--surface-2);text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px}
.ovt td{padding:8px;border-top:1px solid var(--line);vertical-align:top}
.ovt tfoot td{font-weight:700;background:var(--surface-2)}
.ovt .sm,.sm{font-size:12px}
.avs{display:block;white-space:nowrap;font-size:13px}.avs b{font-weight:600}
.linkbtn{border:0;background:none;padding:0;font-weight:700;display:inline-flex;align-items:center;gap:8px;color:var(--ink);text-align:left}
.linkbtn:hover{color:var(--accent);text-decoration:underline}
.chip.sub{margin-left:10px;width:calc(100% - 10px);border-left-style:dashed;padding:2px 6px}
.subadd{border:0;background:none;color:var(--muted);font-size:11px;padding:0 2px}
.subadd:hover{color:var(--accent);text-decoration:underline}
.marks{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.mk{border:1px dashed var(--line);background:transparent;border-radius:99px;font-size:11px;padding:1px 8px;color:var(--muted);font-weight:600}
.mk:hover{border-color:var(--accent);color:var(--accent)}
.mk.on{border-style:solid;background:var(--holiday-soft);border-color:var(--holiday);color:var(--holiday)}
.mk:disabled{cursor:default}
.ahwrap{overflow-x:auto}
table.aht{border-collapse:collapse;min-width:420px;font-size:14px}
.aht th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:6px 12px 6px 0;border-bottom:1px solid var(--line)}
.aht td{padding:5px 12px 5px 0;border-bottom:1px solid var(--line)}
.aht tr.offrow td{color:var(--muted)}
.covd{font-size:11px;font-weight:600;color:var(--ok);background:var(--ok-soft);border-radius:4px;padding:3px 6px;margin-bottom:3px;text-align:center}
.addbtn.small{min-height:22px}
.syncchip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.syncchip .sdot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.syncchip.ok .sdot{background:var(--ok)}.syncchip.warn .sdot{background:var(--warn)}.syncchip.bad .sdot{background:var(--bad)}
.topright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.loginbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;width:100%;max-width:380px;display:grid;gap:14px}
.loginbox h1{margin-top:-8px}
.loginbox input{width:100%;padding:10px;font-size:16px}
.loginbox .btn{justify-content:center;padding:11px}
.err{color:var(--bad);font-weight:600;margin:0}
.tpanel{margin-bottom:14px;display:grid;gap:10px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tday{border:1px solid var(--line);border-radius:var(--r);padding:8px;display:grid;gap:6px;align-content:start}
.tdh{font-family:var(--f-display);font-weight:700;font-size:16px}
.titem{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:start;font-size:13px;cursor:pointer}
.titem input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--ok)}
.titem small{display:block;color:var(--muted);font-size:12px}
.titem.isdone b{text-decoration:line-through;color:var(--muted)}
.dtasks li.isdone>span:last-child{text-decoration:line-through;color:var(--muted)}
.dtasks li.isdone .tk{color:var(--ok)}
.dtasks .tk{color:var(--muted)}
.mtx td{vertical-align:top}
.mtx .daypick{flex-wrap:nowrap}
.mtx .daypick span{padding:2px 6px;font-size:12px}
.warnt{color:var(--warn);font-weight:600}
.mgrid th{white-space:nowrap;font-size:11px}
.mgrid td.mc{text-align:center;font-weight:700;font-family:var(--f-mono);min-width:40px}
.mgrid td.mV{background:var(--accent);color:var(--accent-ink)}
.mgrid td.m1{background:var(--accent-soft);color:var(--accent)}
.mgrid td.m2{background:var(--surface-2);color:var(--ink)}
.covbar .closedpart{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,transparent 0 5px,var(--line) 5px 7px)}

/* ---- Wochenansicht (aufgeräumt) ---- */
.ptop{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ptop .spacer{flex:1}
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.segb{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.segb[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.cnt{font-size:11px;min-width:18px;height:18px;border-radius:9px;display:inline-grid;place-items:center;padding:0 5px;background:var(--warn-soft);color:var(--warn)}
.cnt.bad{background:var(--bad-soft);color:var(--bad)}.cnt.ok{background:var(--ok-soft);color:var(--ok)}
.issuebtn{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:7px}
.issuebtn .sdot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.issuebtn.bad{border-color:var(--bad);color:var(--bad)}.issuebtn.bad .sdot{background:var(--bad)}
.issuebtn.warn{border-color:var(--warn);color:var(--warn)}.issuebtn.warn .sdot{background:var(--warn)}
.more{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 30px rgb(0 0 0 / .18);padding:4px;min-width:260px;z-index:30;display:grid}
.menu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:6px;font-size:14px}
.menu button:hover{background:var(--surface-2)}.menu button.danger{color:var(--bad)}
.lline{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13px;margin:0 0 10px;padding:6px 10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.lline>span{display:inline-flex;align-items:center;gap:5px}
.sm{font-size:12px}
.dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.cdot{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.cdot.ok{background:var(--ok)}.cdot.bad{background:var(--bad)}
.dayh .tags{min-height:0;margin-top:5px}
.dtk{margin-top:6px;border:0;background:var(--warn-soft);color:var(--warn);font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;text-align:left}
.dtk.bad{background:var(--bad-soft);color:var(--bad)}.dtk.ok{background:var(--ok-soft);color:var(--ok)}
.grid th.hrs,.grid td.hrs{width:86px;min-width:86px;padding:8px;font-size:12px;vertical-align:middle;text-align:right}
.grid td.hrs .pill{display:block;width:max-content;margin:4px 0 0 auto;font-size:11px}
.grid .empcell{width:150px;min-width:140px}
.grid td.empcell{position:sticky;left:0;z-index:2;background:var(--surface)}
.grid th.empcell{position:sticky;left:0;z-index:2;background:var(--surface-2)}
.grid tr.totrow td.empcell{background:var(--surface-2)}
.grid .dayh{min-width:112px}
td.cell{height:auto;min-height:54px;padding:4px}
.chip{padding:5px 7px;margin-bottom:3px}
.chip .t{display:block;font-weight:700;font-size:13px}
.chip .k{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .k i{font-style:normal;font-weight:700;color:var(--ink);opacity:.7}
.chip.sub{margin-left:8px;width:calc(100% - 8px)}
.mkp{display:inline-block;font-size:11px;font-weight:700;color:var(--holiday);background:var(--holiday-soft);border-radius:4px;padding:1px 6px;margin:2px 0}
.addbtn{display:flex;justify-content:space-between;align-items:center;gap:4px;width:100%;min-height:40px;border:1px dashed transparent;background:transparent;border-radius:var(--r);color:var(--muted);font-size:12px;padding:4px 6px}
.addbtn b{font-size:16px;font-weight:400;opacity:.35;margin-left:auto}
td.cell:hover .addbtn,.addbtn:focus-visible{border-color:var(--line)}
td.cell:hover .addbtn b{opacity:1;color:var(--accent)}
.moreb{position:absolute;top:5px;right:6px;border:0;background:var(--surface);border-radius:4px;color:var(--muted);font-size:13px;line-height:1;padding:2px 5px;opacity:0}
td.cell:hover .moreb,.moreb:focus-visible{opacity:1}
@media (hover:none){.moreb{opacity:.75}}
.overlay.side{justify-content:flex-end;align-items:stretch;padding:0}
.overlay.side .modal{max-width:440px;max-height:none;height:100%;border-radius:0;padding:18px max(18px,env(safe-area-inset-right,0px)) 18px 18px;padding-top:calc(18px + env(safe-area-inset-top,0px))}
.sheeth{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.ish{margin:16px 0 2px;font-size:17px}.ish.bad{color:var(--bad)}.ish.warn{color:var(--warn)}
.mlist{display:grid;gap:6px;margin-top:12px}
.mitem{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.mitem:hover{border-color:var(--accent);background:var(--accent-soft)}
.mitem small{color:var(--muted);font-size:12px}
.sect.coll>h3{cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.sect.coll>h3::after{content:"▾";font-size:14px;color:var(--muted);transition:transform .15s}
.sect.coll.closed>h3::after{transform:rotate(-90deg)}
.sect.coll.closed>:not(h3){display:none!important}
.sect.coll.closed>h3{border-bottom-color:transparent;padding-bottom:0}
.legend i.lgx{background:#b9d3dc}
.btab{border-collapse:collapse;width:100%;min-width:560px;font-size:14px}
.btab th,.btab td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.btab thead th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.btab th.bd{font-family:var(--f-display);font-size:18px;width:130px;white-space:nowrap}
.btab th.bd span{display:block;font-size:12px;font-family:var(--f-mono);font-weight:400}
.btab td.bc{width:45%}
.btab td.closed{background:var(--holiday-soft)}
.bs{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;margin:0 4px 6px 0}
.bs.ok{background:var(--ok-soft);color:var(--ok)}.bs.bad{background:var(--bad-soft);color:var(--bad)}.bs.none{background:var(--surface-2);color:var(--muted)}
.bp{list-style:none;margin:0;padding:0;display:grid;gap:3px}
.bp li{display:grid;grid-template-columns:12px 112px max-content;gap:8px;align-items:center}
.bp li .dot{width:9px;height:9px;border-radius:50%;background:hsl(var(--h) 55% 50%)}
.bp li .mono{font-size:13px;color:var(--muted)}
.covcol{min-width:0;display:grid;gap:4px}
.covrow{align-items:start}.covrow .d{padding-top:6px}
.lanes{position:relative}
.lane{position:absolute;height:19px;border-radius:4px;background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border-left:3px solid hsl(var(--h) var(--chip-s) var(--chip-l));font-size:11px;line-height:19px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.lane span{color:var(--muted);font-family:var(--f-mono);font-size:10px}
.cov .covrow+.covrow{border-top:1px solid var(--line);padding-top:8px}
.empbtn2{border:0;background:transparent;padding:0;text-align:left;color:inherit;font:inherit;cursor:pointer}
.empbtn2:disabled{cursor:default}
.empbtn2:not(:disabled):hover .empname{color:var(--accent);text-decoration:underline}
.autointro{margin-bottom:14px}
.agrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.acard .ahead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.acard ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.acard li::marker{color:var(--accent)}
.propbar{display:grid;gap:8px;padding:10px 12px;margin:0 0 10px;border:1px solid var(--warn);background:var(--warn-soft);border-radius:var(--r)}
.prop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.pbtn{display:flex;gap:6px}
.abhead{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 12px;background:var(--surface-2);border-radius:var(--r)}
.abhead .big{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.1}
.abt tr.rec td{background:var(--ok-soft)}
.freep{display:grid;gap:10px;margin-bottom:14px}
.freerow{display:grid;grid-template-columns:180px minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.freerow{grid-template-columns:1fr}}
.fdays{display:flex;gap:4px;flex-wrap:wrap}
.fd{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:4px 8px;font-weight:700;font-size:13px;display:grid;justify-items:center;min-width:52px;line-height:1.2}
.fd small{font-weight:400;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.fd.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}.fd.on small{color:var(--bg)}
.fd.blocked{opacity:.45}
.fd:disabled{opacity:.35;cursor:default}
.freemsg{margin:0;font-size:14px;padding:8px 10px;border-radius:var(--r);background:var(--accent-soft)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

/* grid */
.gridbox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:collapse;width:100%;min-width:980px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);vertical-align:top;text-align:left}
.grid th:last-child,.grid td:last-child{border-right:0}
.grid thead th{background:var(--surface-2);padding:8px;font-weight:600}
.grid .dayh{min-width:122px}
.dayh .dn{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1}
.dayh .dd{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.dayh .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:20px}
.dtasks{list-style:none;margin:8px 0 0;padding:6px 0 0;border-top:1px solid var(--line);display:grid;gap:4px;font-weight:400}
.dtasks li{display:grid;grid-template-columns:14px 1fr;gap:4px;font-size:12px;line-height:1.25}
.dtasks li>span:last-child{display:grid}
.dtasks small{color:var(--muted);font-size:11px}
.dtasks .tk{color:var(--ok);font-weight:700}
.dtasks li.miss .tk,.dtasks li.miss small{color:var(--bad);font-weight:700}
.dayh.closed{background:var(--holiday-soft)}
.empcell{padding:8px 10px;width:210px;min-width:190px}
.empname{display:flex;align-items:center;gap:8px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:hsl(var(--h) 55% 50%)}
.emprole{font-size:12px;color:var(--muted)}
.hours{margin-top:6px;font-size:12px;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.meter{height:5px;background:var(--surface-2);border-radius:3px;margin-top:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.meter i.over{background:var(--bad)}
td.cell{padding:5px;height:64px;position:relative}
td.cell.off{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--surface-2) 6px 8px)}
td.cell.closed{background:var(--holiday-soft)}
.addbtn{width:100%;min-height:44px;border:1px dashed transparent;background:transparent;border-radius:var(--r);color:var(--muted);font-size:12px}
td.cell:hover .addbtn{border-color:var(--line)}
.addbtn:hover{color:var(--accent);border-color:var(--accent)!important}
.chip{display:block;width:100%;text-align:left;border:0;border-left:4px solid hsl(var(--h) var(--chip-s) var(--chip-l));background:hsl(var(--h) var(--chip-s) var(--chip-bg-l));border-radius:4px;padding:4px 6px;margin-bottom:4px;color:var(--ink)}
.chip .t{font-size:13px;font-weight:500}
.chip .k{font-size:11px;color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.chip.err{outline:2px solid var(--bad);outline-offset:-2px}
.chip.wrn{outline:2px dashed var(--warn);outline-offset:-2px}
.cell .mini{position:absolute;right:6px;bottom:4px}
.availnote{font-size:11px;color:var(--muted);font-family:var(--f-mono)}

/* coverage */
.cov{margin-top:20px;display:grid;gap:10px}
.covrow{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center}
.covrow .d{font-weight:700;font-family:var(--f-display);font-size:17px}
.covbar{position:relative;height:30px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.covbar span{position:absolute;top:0;bottom:0}
.covbar .need-ok{background:var(--ok)}
.covbar .need-bad{background:var(--bad)}
.covbar .extra{background:#b9d3dc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .covbar .extra{background:#2b4a55}}
:root[data-theme="dark"] .covbar .extra{background:#2b4a55}
.covbar .closedbar{position:absolute;inset:0;background:var(--holiday-soft);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--holiday);font-weight:700}
.axis{display:grid;grid-template-columns:110px 1fr;gap:10px}
.axis .ticks{position:relative;height:16px;font-size:11px;color:var(--muted);font-family:var(--f-mono)}
.axis .ticks span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}

/* issues */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:24px}
@media (max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{margin-bottom:8px}
.issues{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.issues li{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:14px;align-items:baseline}
.issues .sev{width:8px;height:8px;border-radius:50%;margin-top:6px}
.sev.err{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--accent)}

/* modal */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:10px;padding:18px;width:100%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgb(0 0 0 / .3)}
.modal h2{margin-bottom:4px}
.frow{display:grid;gap:4px;margin-top:12px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mactions{display:flex;gap:8px;justify-content:space-between;margin-top:18px;flex-wrap:wrap}
.mactions div{display:flex;gap:8px}

/* employees */
.emplayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}
@media (max-width:760px){.emplayout{grid-template-columns:1fr}}
.emplist{display:grid;gap:4px;align-content:start}
.empbtn{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:var(--r)}
.empbtn[aria-current=true]{background:var(--surface);border-color:var(--line)}
.empbtn small{display:block;color:var(--muted);font-size:12px}
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field input,.field select{width:100%}
.sect{display:grid;gap:10px}
.sect h3{border-bottom:1px solid var(--line);padding-bottom:6px}
.avail{display:grid;gap:6px}
.availrow{display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center}
.availrow .times{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.check{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.abslist{display:grid;gap:6px}
.absrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* rules */
.rules{display:grid;gap:10px}
.rule{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px}
.rule .rhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rule .rhead input{flex:1;min-width:160px;font-weight:600}
.daypick{display:flex;gap:4px;flex-wrap:wrap}
.daypick label{display:inline-flex}
.daypick input{position:absolute;opacity:0;pointer-events:none}
.daypick span{border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.daypick input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daypick input:focus-visible+span{outline:2px solid var(--accent)}
.rparams{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.hlist{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.hlist li{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--line)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.ro .edit-only{display:none!important}
@media (max-width:560px){h1{font-size:24px}.covrow,.axis{grid-template-columns:70px 1fr}.frow2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.chip,.btn{transition:background .15s,filter .15s}}
/* ===== Modernes Erscheinungsbild (1.14) ===== */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#eef1f4; --line:#e2e7ec; --ink:#14202b; --muted:#66727e;
  --accent:#1f6f8b; --accent-soft:#e3f0f5;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;
  --f-mono:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  --r:10px; --shadow:0 1px 2px rgb(16 24 40 / .06),0 1px 3px rgb(16 24 40 / .08);
  --c-leergut:#2f80c2; --s-leergut:#e6f1fa;
  --c-flaeche:#2c9a64; --s-flaeche:#e5f5ec;
  --c-einweg:#c98a0b; --s-einweg:#fbf1dc;
  --c-leitung:#7b56c2; --s-leitung:#efe9fa;
  --c-azubi:#d0603c; --s-azubi:#fbe9e3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1418; --surface:#171d23; --surface-2:#1f262d; --line:#2a333c; --ink:#e7ecf1; --muted:#97a3ae; --accent:#6db8d2; --accent-soft:#183039;
  --c-leergut:#6fb3ea; --s-leergut:#16283a; --c-flaeche:#62c793; --s-flaeche:#132c20; --c-einweg:#e7b450; --s-einweg:#2f2512; --c-leitung:#b49af0; --s-leitung:#251d38; --c-azubi:#f0916f; --s-azubi:#33201a}}
:root[data-theme="dark"]{
  --bg:#0f1418; --surface:#171d23; --surface-2:#1f262d; --line:#2a333c; --ink:#e7ecf1; --muted:#97a3ae; --accent:#6db8d2; --accent-soft:#183039;
  --c-leergut:#6fb3ea; --s-leergut:#16283a; --c-flaeche:#62c793; --s-flaeche:#132c20; --c-einweg:#e7b450; --s-einweg:#2f2512; --c-leitung:#b49af0; --s-leitung:#251d38; --c-azubi:#f0916f; --s-azubi:#33201a}
body{letter-spacing:-.005em}
h1,h2,h3{letter-spacing:-.01em}
/* Kopfzeile */
.top{border-bottom:0;padding-bottom:6px;align-items:center}
.brand .lbl{margin-bottom:2px}
h1{font-size:26px;font-weight:700}
.topright{flex-direction:row;align-items:center;gap:10px;flex-wrap:wrap}
.weeknav{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;box-shadow:var(--shadow)}
.weeknav .btn{border:0;background:transparent;border-radius:999px;padding:6px 11px}
.weeknav .btn:hover{background:var(--surface-2)}
.kw{font-size:17px;min-width:0;padding:0 4px}
.range{font-family:var(--f-body);font-size:13px;min-width:0;padding-right:4px}
.syncchip{box-shadow:var(--shadow)}
.tabs{border-bottom:1px solid var(--line);gap:18px;margin:8px 0 16px}
.tab{border-radius:0;padding:10px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--muted)}
.tab[aria-selected=true]{background:transparent;color:var(--ink);border-bottom-color:var(--accent)}
.seg .tab{border-bottom:0;padding:6px 12px}
.btn{border-radius:8px}
.btn.primary{box-shadow:var(--shadow)}
.panel,.form,.lline,.propbar{border-radius:var(--r)}
.lline{box-shadow:none;background:transparent;border-style:dashed}
/* Plan-Raster */
.gridbox.g2{border:0;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.g2 .grid th,.g2 .grid td{border-right:0;border-bottom:1px solid var(--line)}
.g2 .grid thead th{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;vertical-align:top}
.g2 .grid .dayh{min-width:118px}
.g2 .dh2{display:flex;align-items:flex-start;gap:6px}
.g2 .dwk{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:5px;width:22px}
.g2 .dnum{font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.g2 .dnum span{font-size:12px;font-weight:600;color:var(--muted);margin-left:3px}
.g2 .cdot{margin:0;align-self:center;width:9px;height:9px;flex:none}
.g2 .cdot.none{background:transparent}
.g2 .dh2{gap:5px}
.g2 .dh2{align-items:center}
.g2 .dwk{padding-top:0}
.g2 .dayh.today .dnum{color:#fff;background:var(--accent);border-radius:8px;padding:2px 6px}
.g2 .dayh.today .dnum span{color:rgb(255 255 255 / .85)}
.g2 td.today{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.g2 .dayh.closed,.g2 td.cell.closed{background:var(--surface-2)}
.g2 .tags{gap:4px;margin-top:6px}
.tg{font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;background:var(--surface-2);color:var(--muted)}
.tg.hol{background:var(--holiday-soft);color:var(--holiday)}.tg.warn{background:var(--warn-soft);color:var(--warn)}.tg.fer{background:var(--fer-soft);color:var(--fer)}.tg.acc{background:var(--accent-soft);color:var(--accent)}
.g2 .dtk{border-radius:6px;font-size:11px;margin-top:6px}
.g2 .empcell{width:150px;min-width:132px;padding:8px 12px}
.g2 td.empcell{background:var(--surface)}
.g2 .empname{font-weight:600;font-size:14px}
.g2 .empbtn2{display:block}
.kd{display:inline-block;margin-top:3px;font-size:11px;font-weight:600;color:var(--muted)}
.kd.frueh::before,.kd.spaet::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
.kd.frueh::before{background:#e0a400}.kd.spaet::before{background:#3d5a99}
.g2 tr.grp td{background:var(--bg);border-bottom:0;padding:14px 12px 4px;height:auto}
.g2 tr.grp td.empcell{background:var(--bg)}
.gl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.gl::before{content:"";width:8px;height:8px;border-radius:3px;background:var(--muted)}
.gl.t-leergut::before{background:var(--c-leergut)}.gl.t-leitung::before{background:var(--c-leitung)}.gl.t-einweg::before{background:var(--c-einweg)}.gl.t-azubi::before{background:var(--c-azubi)}
.g2 td.cell{padding:5px;vertical-align:top}
.g2 td.cell.off{background:transparent}
.chip2{position:relative;display:block;width:100%;text-align:left;border:0;border-radius:8px;padding:6px 8px 6px 10px;margin-bottom:4px;background:var(--surface-2);color:var(--ink);box-shadow:inset 3px 0 0 var(--muted);font:inherit}
.chip2 .t{display:block;font-weight:650;font-size:13px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.chip2 .k{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip2:hover{filter:brightness(.97)}
.chip2.t-leergut{background:var(--s-leergut);box-shadow:inset 3px 0 0 var(--c-leergut)}
.chip2.t-flaeche{background:var(--s-flaeche);box-shadow:inset 3px 0 0 var(--c-flaeche)}
.chip2.t-einweg{background:var(--s-einweg);box-shadow:inset 3px 0 0 var(--c-einweg)}
.chip2.t-leitung{background:var(--s-leitung);box-shadow:inset 3px 0 0 var(--c-leitung)}
.chip2.sub{margin-left:10px;width:calc(100% - 10px);opacity:.9}
.chip2 .flag{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%}
.chip2 .flag.err{background:var(--bad);box-shadow:0 0 0 2px var(--surface)}
.chip2 .flag.wrn{background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
.g2 .addbtn{min-height:38px;border-radius:8px;font-size:12px}
.g2 .addbtn span{color:var(--muted)}
.g2 .addbtn .okn{color:var(--ok)}
.g2 td.cell:hover .addbtn{border-color:var(--line);background:var(--surface-2)}
.g2 .moreb{top:6px;right:20px}
.g2 .mkp{border-radius:6px}
.g2 .hrs{width:92px;min-width:84px;text-align:right}
.hv{font-weight:650;font-variant-numeric:tabular-nums;font-size:13px}
.hv small{font-weight:400;color:var(--muted)}
.hb{display:block;width:max-content;margin:4px 0 0 auto;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px}
.hb.bad{background:var(--bad-soft);color:var(--bad)}.hb.warn{background:var(--warn-soft);color:var(--warn)}.hb.acc{background:var(--accent-soft);color:var(--accent)}
.g2 tr.totrow td{background:var(--surface);border-bottom:0;font-weight:600;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;padding:10px 8px}
.g2 tr.totrow td.empcell{color:var(--ink)}
.issuebtn,.segb{font-family:var(--f-body)}
.seg{border-radius:10px}
.g2 .grid{table-layout:fixed;min-width:960px}
.g2 .grid th.empcell{width:150px}
.g2 .grid th.hrs{width:92px}
.g2 tr.totrow td.empcell{background:var(--surface)}
.g2 td.cell .chip2,.g2 td.cell .addbtn{width:100%}
.chip2{padding-right:14px}
.chip2 .t{white-space:nowrap;overflow:hidden;text-overflow:clip}
.chip2 .flag{top:4px;right:4px;width:7px;height:7px}
.g2 .addbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.g2 .addbtn b{flex:none}
.ovr{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;margin-top:12px;padding:10px 12px;border:1px dashed var(--warn);border-radius:10px;background:var(--warn-soft);cursor:pointer}
.ovr input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--warn)}
.ovr small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ovr.on{border-style:solid}
.mitem.exc{border-style:dashed;border-color:var(--warn)}

/* Urlaubsplaner */
.vplan{padding:10px 12px;overflow-x:auto}
.vin{min-width:880px}
.vrow,.vhead{display:grid;grid-template-columns:150px 1fr;align-items:stretch}
.vname{display:flex;align-items:center;gap:6px;padding-right:8px;min-width:0;font-size:14px}
.vname .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vname small{margin-left:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.vname small.neg,.neg{color:var(--bad)!important}
.vtrack{position:relative;min-height:30px;border-bottom:1px solid var(--line)}
.vtrack.clk{cursor:copy}
.vhead .vtrack{min-height:0;border:0}
.vmon{height:22px}.vmon span{position:absolute;top:0;bottom:2px;font-weight:700;font-size:13px;padding-left:4px;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.vdays{height:16px}.vdays span{position:absolute;top:0;font-size:10px;padding-left:2px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.vdays span.so{color:var(--ink);opacity:.45}.vdays span.hol{color:var(--holiday);font-weight:700}
.vkw{height:16px;border-bottom:1px solid var(--line)!important}.vkw span{position:absolute;top:0;font-size:10px;color:var(--muted);padding-left:2px;border-left:1px solid var(--line)}
.vhead .vname.lbl{font-size:10px}
.vcal .vtrack{min-height:18px}
.vfer{position:absolute;top:3px;bottom:3px;background:var(--fer-soft);color:var(--fer);font-size:10px;padding-left:3px;border-radius:3px;overflow:hidden;white-space:nowrap}
.vblk{position:absolute;top:3px;bottom:3px;border-radius:3px;background:repeating-linear-gradient(135deg,var(--bad) 0 3px,transparent 3px 6px);opacity:.75}
.vblk.part{opacity:.35}
.vgrp{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;padding:10px 0 2px}
.vbg{position:absolute;top:0;bottom:0;background:var(--surface-2);pointer-events:none}.vbg.hol{background:var(--holiday-soft)}
.vsep{position:absolute;top:0;bottom:0;width:1px;background:var(--line);pointer-events:none}
.vtoday{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;z-index:2}
.vbl{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 22%,transparent) 0 3px,transparent 3px 7px);pointer-events:none}
.vcf{position:absolute;bottom:0;height:4px;background:var(--bad);pointer-events:none;z-index:1}.vcf.warn{background:var(--warn)}
.vbar{position:absolute;top:5px;bottom:7px;border:0;border-radius:4px;padding:0 4px;background:hsl(var(--h) 55% 46%);color:#fff;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;text-align:left;z-index:3;min-width:4px}
.vbar span{pointer-events:none}
.vbar{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.vbar.lift{z-index:6;transform:translateY(-2px);box-shadow:0 6px 16px rgb(0 0 0 / .3);cursor:grabbing;overflow:visible;transition:left .06s}
body.vdragging{-webkit-user-select:none;user-select:none;cursor:grabbing}
.vbar.wish{background:repeating-linear-gradient(135deg,hsl(var(--h) 60% 85%) 0 5px,hsl(var(--h) 60% 76%) 5px 10px);color:hsl(var(--h) 60% 22%);box-shadow:inset 0 0 0 1.5px hsl(var(--h) 55% 46%)}

.vleg span{display:inline-flex;align-items:center;gap:6px}
.lg{display:inline-block;width:18px;height:10px;border-radius:3px}
.lg.ok{background:hsl(200 55% 46%)}.lg.wish{background:repeating-linear-gradient(135deg,hsl(200 60% 85%) 0 4px,hsl(200 60% 76%) 4px 8px);box-shadow:inset 0 0 0 1.5px hsl(200 55% 46%)}
.lg.bl{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 35%,transparent) 0 3px,transparent 3px 6px)}.lg.cf{background:var(--bad);height:4px}.lg.fer{background:var(--fer-soft)}
.vrule{display:grid;gap:8px}
.rcard{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px}

.overlay.vwide .modal{max-width:560px}

.vrr input[type=date]{width:100%}.vrr .mono{text-align:right}
.vrr.badr input{border-color:var(--bad)}
.vranges.wk .vrh,.vranges.wk .vrr{grid-template-columns:1.6fr 1fr 44px 40px}.vrr select{width:100%}.vrr .vrd{grid-column:1/-1;margin-top:-4px}
.vlist{display:grid;gap:10px}
.vlist .vgrp{padding-top:6px}
.vlcard{background:var(--surface);border:1px solid var(--line);border-left:4px solid hsl(var(--h) 55% 46%);border-radius:var(--r);padding:10px 12px}
.vlhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.vlhead .dot{background:hsl(var(--h) 55% 50%)}
.vlt{min-width:640px;width:100%}.vlt td{padding:4px 8px 4px 0;vertical-align:middle}.vlt input[type=text]{width:100%;min-width:120px}
.vlt tr.vrbad td:first-child{box-shadow:inset 3px 0 0 var(--bad)}.vlt tr.vrwarn td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.vlt{table-layout:fixed}.vlt th:nth-child(1){width:34px}.vlt th:nth-child(2),.vlt th:nth-child(3){width:170px}.vlt th:nth-child(4){width:56px}.vlt th:nth-child(5){width:130px}.vlt th:nth-child(7){width:56px}.vlt input[type=date]{width:100%}
.vlt tr.vlinfo td{border-bottom:1px solid var(--line);font-size:12px;padding-top:0}.vlinfo .err{color:var(--bad)}.vlinfo .warn{color:var(--warn)}
.vlt tr.vdraft input{background:var(--surface-2)}
@media print{.vplan{overflow:visible}}
</style>

<body>
<div id="login" hidden></div>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand"><span class="lbl">Getränkeabteilung</span><h1>Schichtplan</h1></div>
    <div class="topright"><button class="syncchip" id="sync" type="button"></button><div class="weeknav" id="weeknav"></div></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <div id="notice"></div>
  <main id="view"><div class="empty">Plan wird geladen …</div></main>
</div>
<div id="modal"></div>

<script src="firebase-config.js"></script>
<script src="fb-app.js"></script>
<script src="fb-auth.js"></script>
<script src="fb-firestore.js"></script>
<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const toMin=t=>{const [h,m]=String(t||"0:0").split(":").map(Number);return h*60+(m||0)};
const toT=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const fmtH=m=>(m/60).toLocaleString("de-DE",{minimumFractionDigits:m%60?2:0,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const dkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const pdate=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mondayOf=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const wd=(x.getDay()+6)%7;return addDays(x,-wd)};
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();const w=Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);return {y,w}}
const weekId=mon=>{const {y,w}=isoWeek(mon);return y+"-W"+pad(w)};
const DN=["So","Mo","Di","Mi","Do","Fr","Sa"];
const DNL=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const WD=[1,2,3,4,5,6];
const ROLES={leergut:"Leergut",einweg:"Einwegpacker",azubi:"Auszubildender",stv:"Stellv. Abteilungsleitung",al:"Abteilungsleitung"};
const AREAS={leergut:"Leergut",flaeche:"Fläche (Leitung zählt mit)",einweg:"Einweg",leitung:"Leitung (AL oder Stellv.)"};
const TASKS={leergut:"Leergut",flaeche:"Fläche",einweg:"Einweg",leitung:"Leitung"};
const CONTRACTS=["Ausbildung","Minijob","Aushilfe","Werkstudent","Teilzeit","Vollzeit","Rentner (Minijob)"];
const STATES={BW:"Baden-Württemberg",BY:"Bayern",BE:"Berlin",BB:"Brandenburg",HB:"Bremen",HH:"Hamburg",HE:"Hessen",MV:"Mecklenburg-Vorpommern",NI:"Niedersachsen",NW:"Nordrhein-Westfalen",RP:"Rheinland-Pfalz",SL:"Saarland",SN:"Sachsen",ST:"Sachsen-Anhalt",SH:"Schleswig-Holstein",TH:"Thüringen"};
const SLOT=15;

/* ---------- holidays ---------- */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
const hCache={};
function holidays(y,st){
  const ck=y+st; if(hCache[ck])return hCache[ck];
  const E=easter(y),H={};
  const put=(d,n)=>{H[dkey(d)]=n};
  put(new Date(y,0,1),"Neujahr");
  if(["BW","BY","ST"].includes(st))put(new Date(y,0,6),"Heilige Drei Könige");
  if(["BE","MV"].includes(st))put(new Date(y,2,8),"Frauentag");
  put(addDays(E,-2),"Karfreitag");put(addDays(E,1),"Ostermontag");
  put(new Date(y,4,1),"Tag der Arbeit");put(addDays(E,39),"Christi Himmelfahrt");put(addDays(E,50),"Pfingstmontag");
  if(["BW","BY","HE","NW","RP","SL"].includes(st))put(addDays(E,60),"Fronleichnam");
  if(st==="SL")put(new Date(y,7,15),"Mariä Himmelfahrt");
  if(st==="TH")put(new Date(y,8,20),"Weltkindertag");
  put(new Date(y,9,3),"Tag der Deutschen Einheit");
  if(["BB","HB","HH","MV","NI","SN","ST","SH","TH"].includes(st))put(new Date(y,9,31),"Reformationstag");
  if(["BW","BY","NW","RP","SL"].includes(st))put(new Date(y,10,1),"Allerheiligen");
  if(st==="SN"){let d=new Date(y,10,22);while(d.getDay()!==3)d=addDays(d,-1);put(d,"Buß- und Bettag")}
  put(new Date(y,11,25),"1. Weihnachtstag");put(new Date(y,11,26),"2. Weihnachtstag");
  return hCache[ck]=H;
}
const holidayName=k=>{const st=S.cfg?.settings?.state||"HE";return holidays(+k.slice(0,4),st)[k]};
function autoClosed(k){const d=pdate(k);return d.getDay()===0||!!holidayName(k)}
function dayInfo(k){
  const ov=S.cfg?.dayOverrides?.[k];
  const hol=holidayName(k);const d=pdate(k);
  let type="normal",nextHol=null;
  if(autoClosed(k))type="geschlossen";
  else{let x=addDays(d,1);for(let i=0;i<4;i++){const xk=dkey(x);if(!autoClosed(xk))break;if(holidayName(xk)){nextHol=holidayName(xk);break}x=addDays(x,1)}
    if(nextHol)type="vorFeiertag";}
  return {type:ov?.type||type,auto:type,hol,nextHol,override:ov||null,note:ov?.note||""};
}

/* ---------- state ---------- */
const S={cfg:null,weeks:{},week:mondayOf(addDays(new Date(),7)),tab:"plan",selEmp:null,ro:false,mode:"loading",lastPlan:null,role:null,me:null,members:[],done:{}};
const pending={};const timers={};
const LS="schichtplan-getraenke-v1";
const APP_VERSION="2.5 · 20.11.2026";
const TEAM="getraenke";
const MAIL_DOMAIN="schichtplan.local";
const FB_CONFIG=(window.FB_CONFIG&&window.FB_CONFIG.apiKey&&!/HIER/.test(window.FB_CONFIG.apiKey))?window.FB_CONFIG:null;
let fdb=null,fauth=null,user=null,unsubs=[],inflight=0,syncErr="",authMsg="",setupDone=null;
const clean=o=>JSON.parse(JSON.stringify(o));
const teamRef=()=>fdb.collection("teams").doc(TEAM);
const refFor=p=>{const [c,d]=p.split("/");return teamRef().collection(c).doc(d)};
const toMail=u=>{u=String(u||"").trim().toLowerCase();return u.includes("@")?u:u.replace(/[^a-z0-9._-]/g,"")+"@"+MAIL_DOMAIN};
const canEditRole=r=>r==="admin"||r==="bearbeiten";
const ROLE_LBL={admin:"Admin (alles, Zugänge verwalten)",bearbeiten:"Bearbeiten",lesen:"Nur ansehen"};

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify({cfg:S.cfg,weeks:S.weeks,done:S.done}))}catch(e){}}
function loadLocal(){try{const raw=localStorage.getItem(LS);if(raw){const o=JSON.parse(raw);S.cfg=o.cfg||null;S.weeks=o.weeks||{};S.done=o.done||{}}}catch(e){}}
function track(p){inflight++;renderSync();p.then(()=>{syncErr=""},err=>{syncErr=err&&err.code==="permission-denied"?"Keine Berechtigung zum Speichern. Firestore-Regeln oder Rolle prüfen.":"Übertragung fehlgeschlagen: "+(err&&err.message||err);showNotice(syncErr)}).finally(()=>{inflight--;renderSync()});return p}
function save(docPath,body){
  if(S.ro||S.dry)return;
  saveLocal();
  if(S.mode!=="cloud"||!fdb)return;
  pending[docPath]=(pending[docPath]||0)+1;
  clearTimeout(timers[docPath]);
  timers[docPath]=setTimeout(()=>{
    track(refFor(docPath).set(clean(body()))).catch(()=>{}).finally(()=>{pending[docPath]=0});
  },450);
}
const saveCfg=()=>save("plan/config",()=>S.cfg);
const saveWeek=wid=>save("weeks/"+wid,()=>({shifts:S.weeks[wid]||[],done:S.done[wid]||{}}));

function showNotice(msg){$("#notice").innerHTML=msg?`<div class="notice">${esc(msg)}</div>`:""}

function renderSync(){
  const el=$("#sync");if(!el)return;
  let cls="",txt="";
  if(!FB_CONFIG){cls="warn";txt="Nur auf diesem Gerät"}
  else if(!user){cls="warn";txt="Nicht angemeldet"}
  else if(!navigator.onLine){cls="warn";txt=inflight?`Offline · ${inflight} Änderung${inflight>1?"en":""} warten`:"Offline"}
  else if(syncErr){cls="bad";txt="Fehler beim Abgleich"}
  else if(inflight){cls="";txt="Speichert …"}
  else{cls="ok";txt="Abgeglichen"}
  el.className="syncchip "+cls;el.innerHTML=`<span class="sdot"></span>${esc(txt)}${S.me?` · ${esc(S.me.name||S.me.username||"")}`:""}`;
}

async function init(){
  loadLocal();
  renderChrome();renderSync();
  window.addEventListener("online",renderSync);window.addEventListener("offline",renderSync);
  $("#sync").onclick=()=>{S.tab="data";render()};
  if(!FB_CONFIG||!window.firebase){
    S.mode="local";
    if(!S.cfg){try{const r=await fetch("startdaten.json");const o=await r.json();if(o&&o.cfg){S.cfg=o.cfg;S.weeks=o.weeks||{};saveLocal()}}catch(e){}}
    if(!S.cfg)S.cfg=blankCfg();
    {const m1=migrateFixed(),m2=migrateHours(),m3=migrateCover(),m4=migrateSpringer(),m5=migrateUrlaub();if(m1||m2||m3||m4||m5)saveLocal()}
    showNotice(FB_CONFIG?"Die Firebase-Dateien (fb-app.js, fb-auth.js, fb-firestore.js) fehlen. Der Plan wird nur auf diesem Gerät gespeichert.":"Firebase ist noch nicht eingerichtet (firebase-config.js). Der Plan wird nur auf diesem Gerät gespeichert.");
    render();return;
  }
  try{
    firebase.initializeApp(FB_CONFIG);
    fdb=firebase.firestore();
    fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    fauth=firebase.auth();
    fauth.onAuthStateChanged(onUser);
  }catch(e){S.mode="local";if(!S.cfg)S.cfg=blankCfg();showNotice("Firebase konnte nicht gestartet werden: "+(e.message||e));render()}
}
function stopListeners(){unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[]}
async function onUser(u){
  if(S.settingUp)return;
  stopListeners();user=u;S.me=null;S.role=null;S.members=[];
  if(!u){S.mode="login";renderLogin();renderSync();return}
  hideLogin();
  let m=null;
  try{const snap=await teamRef().collection("members").doc(u.uid).get();m=snap.exists?snap.data():null;
    if(m)try{localStorage.setItem("sp-me-"+u.uid,JSON.stringify(m))}catch(e){}}
  catch(e){try{m=JSON.parse(localStorage.getItem("sp-me-"+u.uid)||"null")}catch(x){}}
  if(!m){S.mode="login";authMsg="Dieser Zugang ist nicht (mehr) freigeschaltet. Bitte an den Admin wenden.";renderLogin(true);renderSync();return}
  S.me={...m,uid:u.uid};S.role=m.role;S.ro=!canEditRole(m.role);
  document.body.classList.toggle("ro",S.ro);
  S.mode="cloud";renderSync();
  let gotCfg=false,gotWeeks=false;
  unsubs.push(teamRef().collection("plan").doc("config").onSnapshot(snap=>{
    gotCfg=true;
    if(pending["plan/config"])return;
    const d=snap.exists?snap.data():null;
    if(d)S.cfg=clean(d);else if(!S.cfg)S.cfg=blankCfg();
    if(d){const m1=migrateFixed(),m2=migrateHours(),m3=migrateCover(),m4=migrateSpringer(),m5=migrateUrlaub();if(m1||m2||m3||m4||m5)saveCfg()}
    saveLocal();
    if(!d&&S.role==="admin")maybeSeed();
    if(gotWeeks)render();
  },e=>{showNotice("Plan konnte nicht geladen werden ("+(e&&e.code||"Fehler")+").");if(!S.cfg)S.cfg=blankCfg();render()}));
  unsubs.push(teamRef().collection("weeks").onSnapshot(qs=>{
    gotWeeks=true;
    qs.docs.forEach(d=>{if(pending["weeks/"+d.id])return;S.weeks[d.id]=clean(d.data().shifts||[]);S.done[d.id]=clean(d.data().done||{})});
    saveLocal();
    if(gotCfg)render();
  },e=>{}));
  if(S.role==="admin")unsubs.push(teamRef().collection("members").onSnapshot(qs=>{S.members=qs.docs.map(d=>({uid:d.id,...d.data()}));if(S.tab==="access")render()},e=>{}));
  render();
}
let seeding=false;
async function maybeSeed(){
  if(seeding)return;seeding=true;
  try{
    const res=await fetch("startdaten.json",{cache:"no-store"});if(!res.ok)return;
    const o=await res.json();if(!o||!o.cfg)return;
    await importBackup(o,true);
    showNotice("Startdaten übernommen: Mitarbeiter, Regeln und die bisher geplanten Wochen.");
  }catch(e){}finally{seeding=false}
}
async function importBackup(o,silent){
  if(!o||!o.cfg)throw new Error("Keine gültige Sicherung");
  S.cfg=clean(o.cfg);S.weeks=clean(o.weeks||{});S.done=clean(o.done||{});migrateFixed();migrateHours();migrateCover();migrateSpringer();migrateUrlaub();saveLocal();
  if(S.mode==="cloud"&&fdb){
    const ops=[["plan/config",S.cfg],...Object.entries(S.weeks).map(([w,sh])=>["weeks/"+w,{shifts:sh,done:S.done[w]||{}}])];
    for(let i=0;i<ops.length;i+=400){const b=fdb.batch();ops.slice(i,i+400).forEach(([p,d])=>b.set(refFor(p),clean(d)));await track(b.commit())}
  }
  render();
}

/* ---------- Anmeldung ---------- */
async function checkSetup(){
  try{const s=await teamRef().collection("meta").doc("setup").get();setupDone=s.exists}catch(e){setupDone=null}
  return setupDone;
}
function hideLogin(){const l=$("#login");if(l)l.hidden=true;$("#app").hidden=false}
async function renderLogin(blocked){
  $("#app").hidden=true;const l=$("#login");l.hidden=false;
  if(setupDone===null&&!blocked){l.innerHTML=`<div class="loginbox"><p class="muted">Verbindung wird geprüft …</p></div>`;await checkSetup()}
  const first=setupDone===false&&!blocked;
  l.innerHTML=`<form class="loginbox" id="loginForm" novalidate>
    <span class="lbl">Getränkeabteilung</span><h1>Schichtplan</h1>
    ${blocked?`<p class="err">${esc(authMsg)}</p><button class="btn" type="button" id="lgOut">Abmelden</button>`:first?`
      <p class="muted" style="margin:0">Ersteinrichtung: Lege deinen Admin-Zugang an. Danach vergibst du in der App weitere Zugänge.</p>
      <label class="field"><span class="lbl">Dein Name</span><input type="text" id="lgName" autocomplete="name" required></label>
      <label class="field"><span class="lbl">Benutzername</span><input type="text" id="lgUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label class="field"><span class="lbl">Passwort (mind. 6 Zeichen)</span><input type="password" id="lgPw" autocomplete="new-password" required></label>
      <button class="btn primary" type="submit">Admin-Zugang anlegen</button>`:`
      <label class="field"><span class="lbl">Benutzername</span><input type="text" id="lgUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
      <label class="field"><span class="lbl">Passwort</span><input type="password" id="lgPw" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Anmelden</button>
      ${setupDone===null?`<p class="muted" style="font-size:13px;margin:0">Zum ersten Anmelden auf einem Gerät wird einmal Internet gebraucht. Danach funktioniert die App auch offline.</p>`:""}`}
    ${!blocked&&authMsg?`<p class="err">${esc(authMsg)}</p>`:""}
  </form>`;
  const f=$("#loginForm");
  const out=$("#lgOut");if(out)out.onclick=()=>{authMsg="";fauth.signOut()};
  f.onsubmit=async ev=>{ev.preventDefault();if(blocked)return;
    const un=($("#lgUser")?.value||"").trim(),pw=$("#lgPw")?.value||"";authMsg="";
    if(!un||!pw){authMsg="Bitte Benutzername und Passwort eingeben.";renderLogin();return}
    const btn=f.querySelector("button[type=submit]");btn.disabled=true;
    try{
      if(first){
        const name=($("#lgName")?.value||"").trim()||un;
        S.settingUp=true;let cred;
        try{cred=await fauth.createUserWithEmailAndPassword(toMail(un),pw);
        const b=fdb.batch();
        b.set(teamRef().collection("members").doc(cred.user.uid),{name,username:un.toLowerCase(),role:"admin",erstellt:new Date().toISOString()});
        b.set(teamRef().collection("meta").doc("setup"),{erstellt:new Date().toISOString()});
        await b.commit();setupDone=true;}finally{S.settingUp=false}
        await onUser(cred.user);
      }else await fauth.signInWithEmailAndPassword(toMail(un),pw);
    }catch(err){authMsg=authError(err);btn.disabled=false;renderLogin()}
  };
  const first_in=f.querySelector("input");if(first_in)first_in.focus();
}
function authError(err){
  const c=err&&err.code||"";
  if(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c))return "Benutzername oder Passwort stimmt nicht.";
  if(/email-already-in-use/.test(c))return "Diesen Benutzernamen gibt es schon.";
  if(/weak-password/.test(c))return "Das Passwort braucht mindestens 6 Zeichen.";
  if(/invalid-email/.test(c))return "Der Benutzername darf nur Buchstaben, Ziffern, Punkt, Minus und Unterstrich enthalten.";
  if(/network-request-failed/.test(c))return "Keine Internetverbindung. Zum Anmelden wird einmal Internet gebraucht.";
  if(/too-many-requests/.test(c))return "Zu viele Versuche. Bitte ein paar Minuten warten.";
  if(/operation-not-allowed|admin-restricted/.test(c))return "In Firebase ist die Anmeldung per E-Mail/Passwort nicht eingeschaltet.";

function fixedFill(){

function autoFreeDays(){

  const order=[1,2,3,5,4,6];
  /* Woche mit 22-Uhr-Vertretung (z. B. Timon im Urlaub): Frühdienst-Leitung wählt zuerst, damit sie keinen Tag nach einem langen Abend des anderen bekommt */
  const coverWeek=open.some(needCover);
  const seq=coverWeek?[...L].sort((a,b)=>(leadKind(a,open[0])==="spaet")-(leadKind(b,open[0])==="spaet")):L;
  seq.forEach(e=>{const i=L.indexOf(e);

    // Pass 1 meidet Tage nach einem 22-Uhr-Einweg-Abend, wenn früh Fläche/Leitung gebraucht wird (Ruhezeit des anderen)

function hourFill(){
  const wid=curWid(),shifts=weekShifts(wid),added=[],dates=weekDates();
  const dayRank=k=>[4,5,6,1,2,3].indexOf(pdate(k).getDay());
  for(let guard=0;guard<60;guard++){
    const cands=emps().filter(e=>!e.onDemand&&e.role!=="al"&&e.role!=="stv"&&planTarget(e,wid)>0)
      .map(e=>({e,rem:planTarget(e,wid)-weekMinutes(e.id,wid)})).filter(x=>x.rem>=60).sort((a,b)=>b.rem-a.rem);
    let placed=false;
    for(const {e,rem} of cands){
      const days=new Set(shifts.filter(s=>s.empId===e.id&&!s.override).map(s=>s.date)).size;
      if(e.maxDays&&days>=e.maxDays)continue;
      let best=null;
      for(const k of dates){
        if(dayInfo(k).type==="geschlossen"||absentOn(e,k)||shifts.some(s=>s.empId===e.id&&s.date===k))continue;
        const av=availFor(e,k);if(!av)continue;
        let Lm=Math.min((e.maxBlock||8)*60,Math.floor(rem/SLOT)*SLOT,av.to-av.from);
        if(e.monthHours)Lm=Math.min(Lm,Math.floor((e.monthHours*60-monthMinutes(e.id,k.slice(0,7)))/SLOT)*SLOT);
        if(Lm<120)continue;
        let Lg=grossFor(e,Lm);while(Lg>av.to-av.from&&Lm>=120){Lm-=SLOT;Lg=grossFor(e,Lm)}
        if(Lm<120)continue;
        const areas=[defTask(e)];if(e.canLeergut)areas.push("leergut");if(e.canFlaeche)areas.push("flaeche");if(e.canEinweg)areas.push("einweg");
        const cv=coverage(k,shifts);
        for(const area of [...new Set(areas)]){const c=cv[area];if(!c)continue;
          for(let a=av.from;a+Lg<=av.to;a+=SLOT){
            const b=a+Lg;if(!restOK(e,k,a,b,shifts))continue;
            let load=0,cnt=0,def=0,rq=0;for(let i=0;i<c.n;i++){const t=c.ws+i*SLOT;if(t>=a&&t<b){load+=c.have[i];def+=Math.max(c.req[i]-c.have[i],0);if(c.req[i]>0)rq++;cnt++}}
            /* Vorrang: offene Pflicht > Bereich mit Besetzungsregel > eigener Bereich > wenig Leute */

    }

}
function gapFill(){

    for(const k of weekDates()){
      if(dayInfo(k).type==="geschlossen")continue;
      for(let guard=0;guard<30;guard++){
        const gaps=coverage(k,shifts)[area].gaps.filter(g=>g.e-g.s>=SLOT);
        if(!gaps.length)break;
        let best=null;
        for(const phase of [1,2,3]){
          const pool=emps().filter(e=>{
            if(area==="leitung")return phase===1&&(e.role==="al"||e.role==="stv");
            if(phase===1)return e.role===area;
            const can=e.role!==area&&(area==="leergut"?e.canLeergut:area==="einweg"?e.canEinweg:e.canFlaeche);
            return can&&(phase===2?!e.maxDays:!!e.maxDays);
          });
          for(const g of gaps)for(const e of pool){
            if(absentOn(e,k))continue;
            if(shifts.some(s=>s.empId===e.id&&s.date===k))continue;
            const days=new Set(shifts.filter(s=>s.empId===e.id&&!s.override).map(s=>s.date)).size;
            if(e.maxDays&&days>=e.maxDays)continue;
            const av=availFor(e,k);if(!av)continue;
            const ws=Math.max(g.s,av.from),we=Math.min(g.e,av.to);if(we-ws<SLOT)continue;
            const ym=k.slice(0,7),used=monthMinutes(e.id,ym);

            if(e.weekHours){const rem=e.weekHours*60-weekMinutes(e.id,wid);L=Math.min(L,Math.floor(rem/SLOT)*SLOT)}
            if(abbauOf(e,wid)){const rem=weekTarget(e,wid)-weekMinutes(e.id,wid);if(rem<120)continue;L=Math.min(L,Math.floor(rem/SLOT)*SLOT)}

}
const LC_DEF={wdFrom:"08:00",wdTo:"17:15",saFrom:"08:00",saTo:"15:00",azFrom:"15:00",azTo:"20:00",nlFrom:"08:00",nlTo:"16:00",neFrom:"16:00",neTo:"20:00"};

  $("#accBack").onclick=()=>{S.tab="data";render()};

  document.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=()=>{const id=b.dataset.mdel;if(S.confirmMem!==id){S.confirmMem=id;render();return}S.confirmMem=null;track(teamRef().collection("members").doc(id).delete()).catch(()=>{});S.accMsg="Zugang gesperrt. Die Person kann den Plan nicht mehr öffnen.";S.accErr=false;render()});
  $("#newAcc").onsubmit=async ev=>{ev.preventDefault();

    if(!/^[a-z0-9._-]+$/.test(un)){S.accMsg="Benutzername: nur Kleinbuchstaben, Ziffern, Punkt, Minus und Unterstrich.";render();return}
    if(pw.length<6){S.accMsg="Das Passwort braucht mindestens 6 Zeichen.";render();return}

    try{
      const sec=firebase.apps.find(a=>a.name==="zugang")||firebase.initializeApp(FB_CONFIG,"zugang");
      const cred=await sec.auth().createUserWithEmailAndPassword(toMail(un),pw);
      const nuid=cred.user.uid;await sec.auth().signOut();
      await track(teamRef().collection("members").doc(nuid).set({name,username:un,role,erstellt:new Date().toISOString()}));
      S.accMsg=`Zugang für ${name} angelegt. Benutzername: ${un}`;S.accErr=false;
    }catch(err){S.accMsg=authError(err)}
    render();
  };
}

async function shareFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e&&e.name==="AbortError")return}}
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}

function renderPlan(){

  if(!emps().length){$("#view").innerHTML=`<div class="panel empty"><h2>Noch keine Mitarbeiter</h2><p>Hast du eine Sicherung (z. B. die Startdaten-Datei), lade sie unter „Konto & Sicherung“. Oder lege unter „Mitarbeiter“ dein Team neu an.</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn primary edit-only" id="goData">Sicherung laden</button><button class="btn edit-only" id="goTeam">Mitarbeiter anlegen</button></div></div>`;const gd=$("#goData");if(gd)gd.onclick=()=>{S.tab="data";render()};const g=$("#goTeam");if(g)g.onclick=()=>{S.tab="team";addEmployee()};return}
  const issues=weekReport();S.issues=issues;
  const errs=issues.filter(i=>i.lv==="err").length,warns=issues.length-errs;
  const covs=Object.fromEntries(dates.map(k=>[k,coverage(k,shifts)]));
  const allT=dates.flatMap(k=>dayTasks(k,shifts)),openT=allT.filter(x=>!x.done).length,badT=allT.filter(x=>!x.done&&(!x.ok||x.overdue)).length;
  const view=S.planView||"plan";
  const segs=[["plan","Plan"],["tasks",`Aufgaben${allT.length?` <b class="cnt ${badT?"bad":openT?"":"ok"}">${openT}</b>`:""}`],["cov","Besetzung"],["hours","Stunden"]];
  let h=`<div class="ptop">

      ${(()=>{const par=parentOf(draft,weekShifts(curWid()));return par?`<p class="freemsg" style="margin-top:12px">Einsatz innerhalb der Schicht ${par.from}–${par.to}. Zählt nicht extra als Arbeitszeit, ${esc(e.name)} ist in dieser Zeit für ${TASKS[draft.task]} eingeteilt.</p>`:""})()}
      <p class="mono" style="margin:12px 0 0">${(()=>{if(parentOf(draft,weekShifts(curWid())))return "Keine zusätzlichen Stunden";const d0={...draft,sub:false},n=dur(d0);return `${fmtH(Math.max(0,n))} Std. Arbeit${gross(d0)>n?` + ${gross(d0)-n} Min. Pause`:""}`})()}${e.maxBlock?` · max. ${e.maxBlock} Std. am Stück`:""}</p>
      ${S.ro?"":(()=>{const others=weekDates().filter(k=>k!==draft.date);
        const st=k=>{if(dayInfo(k).type==="geschlossen")return {dis:true,n:"zu"};if(absentOn(e,k))return {dis:false,n:absentOn(e,k).kind||"abwesend"};const av=availFor(e,k);const has=weekShifts(curWid()).some(x=>x.empId===e.id&&x.date===k&&x.id!==draft.id);
          if(has){const all=weekShifts(curWid());return parentOf({...draft,id:"x",date:k},all)?{dis:false,n:"Einsatz",ok:false}:{dis:false,n:"ersetzen"}}if(!av)return {dis:false,n:"nicht verfügbar"};if(toMin(draft.from)<av.from||toMin(draft.to)>av.to)return {dis:false,n:"außerhalb"};return {dis:false,n:"",ok:true}};
        const openOk=others.filter(k=>st(k).ok);
        return `<div class="frow"><span class="lbl">Gleiche Zeit auch an</span><div class="daypick copyp">${others.map(k=>{const x=st(k);return `<label title="${esc(x.n)}"><input type="checkbox" data-copy="${k}" ${copy.has(k)?"checked":""} ${x.dis?"disabled":""}><span>${DN[pdate(k).getDay()]}${x.n?`<small>${esc(x.n)}</small>`:""}</span></label>`}).join("")}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost" id="cpAll" type="button" ${openOk.length?"":"disabled"}>Alle passenden Tage</button>${copy.size?`<button class="btn ghost" id="cpNone" type="button">Keine</button>`:""}</div>
        ${[...copy].some(k=>st(k).n==="ersetzen")?`<p class="muted" style="font-size:12px;margin:0">Bestehende Schichten an markierten Tagen werden ersetzt.</p>`:""}</div>`})()}
      ${(()=>{const ruleIs=shiftIssues({...draft,override:false},tmp).filter(i=>i.rule);const dayCnt=new Set(tmp.filter(x=>x.empId===e.id&&x.date!==draft.date&&!x.override).map(x=>x.date)).size;const overDays=e.maxDays&&dayCnt>=e.maxDays;
        if(S.ro||(!ruleIs.length&&!overDays&&!draft.override))return "";
        return `<label class="ovr ${draft.override?"on":""}"><input type="checkbox" id="sovr" ${draft.override?"checked":""}><span><b>Ausnahme: Regeln von ${esc(e.name)} überstimmen</b><small>${draft.override?"Diese Schicht gilt trotz ":"Gilt nur für diese Schicht. Ignoriert "}${[...new Set([...ruleIs.map(i=>i.m),overDays?`max. ${e.maxDays} Tage pro Woche`:""].filter(Boolean))].join(" · ")||"Verfügbarkeit, freie Tage, Tage pro Woche"}${draft.override?".":""}</small></span></label>`})()}
      ${is.length?`<ul class="issues" style="margin-top:10px">${is.map(i=>`<li><span class="sev ${i.lv}"></span><span>${esc(i.m)}</span></li>`).join("")}</ul>`:`<p style="margin:8px 0 0"><span class="pill ok">Passt zu allen Regeln</span></p>`}
      ${draft.id&&!draft.sub&&!S.ro?`<button class="btn ghost" id="ssub" style="margin-top:10px">+ Kurzer Einsatz in anderer Rolle</button>`:""}
      <div class="mactions">${draft.id&&!S.ro?`<button class="btn danger" id="sdel">Löschen</button>`:"<span></span>"}<div><button class="btn" id="scancel">${S.ro?"Schließen":"Abbrechen"}</button>${S.ro?"":`<button class="btn primary" id="ssave">${copy.size?`An ${copy.size+1} Tagen speichern`:"Speichern"}</button>`}</div></div>
    </div></div>`;
    $("#ov").onclick=ev=>{if(ev.target.id==="ov")close()};
    $("#scancel").onclick=close;
    if(!S.ro){
      $("#sf").onchange=ev=>{draft.from=ev.target.value;draw()};
      const ov=$("#sovr");if(ov)ov.onchange=()=>{draft.override=ov.checked;draw()};
      $("#st").onchange=ev=>{draft.to=ev.target.value;draw()};
      document.querySelectorAll("[data-task]").forEach(c=>c.onchange=()=>{let t=tasksOf(draft).filter(x=>x!==c.dataset.task);if(c.checked)t.push(c.dataset.task);t=Object.keys(TASKS).filter(x=>t.includes(x));draft.tasks=t;draft.task=t[0]||"";draw()});
      document.querySelectorAll("[data-copy]").forEach(c=>c.onchange=()=>{c.checked?copy.add(c.dataset.copy):copy.delete(c.dataset.copy);draw()});
      const ca=$("#cpAll");if(ca)ca.onclick=()=>{document.querySelectorAll("[data-copy]").forEach(c=>{const k=c.dataset.copy;const av=availFor(e,k);if(!c.disabled&&av&&!absentOn(e,k)&&toMin(draft.from)>=av.from&&toMin(draft.to)<=av.to&&!weekShifts(curWid()).some(x=>x.empId===e.id&&x.date===k&&x.id!==draft.id))copy.add(k)});draw()};
      const cn=$("#cpNone");if(cn)cn.onclick=()=>{copy.clear();draw()};
      $("#ssave").onclick=()=>{const wid=curWid();let arr=weekShifts(wid);draft.auto=false;
        const others=arr.filter(x=>x.id!==draft.id);draft.sub=!!parentOf(draft,others);
        if(draft.id){const i=arr.findIndex(x=>x.id===draft.id);arr[i]=draft}else{draft.id=uid();arr.push(draft)}
        copy.forEach(k=>{const ns={id:uid(),empId:e.id,date:k,from:draft.from,to:draft.to,task:draft.task,tasks:[...tasksOf(draft)],override:!!draft.override};
          if(parentOf(ns,arr)){ns.sub=true;arr=arr.filter(x=>!(x.sub&&x.empId===e.id&&x.date===k&&toMin(x.from)<toMin(ns.to)&&toMin(x.to)>toMin(ns.from)))}
          else arr=arr.filter(x=>!(x.empId===e.id&&x.date===k));
          arr.push(ns)});
        S.weeks[wid]=arr;saveWeek(wid);close();render()};
      const sb=$("#ssub");if(sb)sb.onclick=()=>{close();newSub(draft.empId,draft.date)};
      const d=$("#sdel");if(d)d.onclick=()=>{const wid=curWid();const all=weekShifts(wid);const kids=draft.sub?[]:all.filter(x=>x.sub&&parentOf(x,all)?.id===draft.id).map(x=>x.id);S.weeks[wid]=all.filter(x=>x.id!==draft.id&&!kids.includes(x.id));saveWeek(wid);close();render()};
    }
    ($("#sf")||$("#scancel")).focus();
  };
  const close=()=>{$("#modal").innerHTML="";document.removeEventListener("keydown",esck)};
  const esck=ev=>{if(ev.key==="Escape")close()};
  document.addEventListener("keydown",esck);
  draw();
}

function availRows(av,key,dis){return `<div class="avail">${WD.map(d=>{const a=av?.[d]||{on:false,from:"07:00",to:"21:15"};return `<div class="availrow"><label class="check"><input type="checkbox" data-${key}="${d}" data-k="on" ${a.on?"checked":""} ${dis}>${DNL[d]}</label>
      <div class="times" ${a.on?"":"hidden"}><select data-${key}="${d}" data-k="from" aria-label="${DNL[d]} ab" ${dis}>${timeOptions(a.from)}</select><span class="muted">bis</span><select data-${key}="${d}" data-k="to" aria-label="${DNL[d]} bis" ${dis}>${timeOptions(a.to)}</select></div></div>`}).join("")}</div>`}
function addEmployee(){
  const avail={};WD.forEach(d=>avail[d]={on:true,from:S.cfg.settings.workStart,to:S.cfg.settings.workEnd});
  const e={id:uid(),name:"Neue Person",role:"leergut",contract:"Minijob",monthHours:40,maxBlock:4,maxDays:0,phone:"",avail,canLeergut:false,canEinweg:false,absences:[],notes:"",hue:Math.floor(Math.random()*360)};
  S.cfg.employees.push(e);S.selEmp=e.id;saveCfg();render();
}
function availSummary(av){
  const on=WD.filter(d=>av?.[d]?.on);if(!on.length)return `<span class="muted">keine Tage</span>`;
  const groups=[];on.forEach(d=>{const a=av[d],key=a.from+"–"+a.to;const g=groups[groups.length-1];if(g&&g.key===key&&g.last===d-1){g.last=d}else groups.push({key,first:d,last:d})});
  return groups.map(g=>`<span class="avs"><b>${DN[g.first]}${g.last!==g.first?(g.last-g.first>1?"–":", ")+DN[g.last]:""}</b> ${g.key.replace(/^07:00–21:15$/,"ganztags").replace(/^07:00–22:00$/,"ganztags")}</span>`).join("");
}
function renderOverview(){

    const wm=weekMinutes(e.id,wid),t=weekTarget(e),st=weekState(e,wm),mm=monthMinutes(e.id,ym);
    tot.ist+=wm;tot.soll+=t;
    const ab=(e.absences||[]).filter(a=>a.to>=dkey(new Date())).sort((a,b)=>a.from.localeCompare(b.from))[0];
    const ein=[];
    const rk=weekRotKind(e,S.week);const lk=(e.role==="al"||e.role==="stv")?leadKind(e,weekDates()[0]):null;const kd=rk||lk;
    return `<tr>
      <td><button class="linkbtn" data-open="${e.id}" style="--h:${e.hue}"><span class="dot"></span>${esc(e.name)}</button><div class="muted sm">${esc(ROLES[e.role]||"")}</div><div class="sks">${empRoles(e).map(r=>`<span class="sk">${TASKS[r]}</span>`).join("")}</div></td>
      <td>${esc(e.contract||"")}<div class="muted sm">${e.weekHours?`${e.weekHours} h/Woche`:e.monthHours?`${e.monthHours} h/Monat`:"kein Soll"}</div></td>
      <td class="mono">${fmtH(wm)}${t?` / ${fmtH(t)}`:""} h ${st?`<span class="pill ${st.cls}">${st.txt}</span>`:""}<div class="muted sm">${monthName(ym)}: ${fmtH(mm)}${e.monthHours?` / ${e.monthHours}`:""} h</div></td>
      <td>${availSummary(e.avail)}${e.vacAvail?.on?`<div class="sm"><span class="pill fer">Ferien</span> ${availSummary(e.vacAvail.days)}</div>`:""}</td>
      <td class="sm">${[e.maxBlock?`max. ${fmtH(e.maxBlock*60)} h am Stück`:"",e.maxDays?`max. ${e.maxDays} Tage/Woche`:"",e.breakMin?`${e.breakMin} Min. Pause`:"",e.onDemand?"nur bei Bedarf":"",...(e.fixed||[]).filter(f=>(f.days||[]).length).map(f=>`fest: ${f.days.map(d=>DN[d]).join(", ")} ${f.from}–${f.to}`)].filter(Boolean).join("<br>")||"–"}</td>
      <td>${kd?`<span class="pill ${kd==="frueh"?"acc":"warn"}">${kd==="frueh"?"Früh":"Spät"}</span>`:`<span class="muted">–</span>`}</td>
      <td><div class="sks" style="margin:0">${skillTags(e)}${ein.map(x=>`<span class="sk">kann ${x}</span>`).join("")}</div>${!(e.skills||[]).length&&!ein.length?`<span class="muted">–</span>`:""}</td>
      <td class="sm">${ab?`${esc(ab.kind)} ${shortD(ab.from)}${ab.to!==ab.from?"–"+shortD(ab.to):""}`:"–"}${(e.freeDays||[]).filter(k=>weekDates().includes(k)).length?`<div>frei: ${(e.freeDays||[]).filter(k=>weekDates().includes(k)).map(k=>DN[pdate(k).getDay()]).join(", ")}</div>`:""}</td>
      <td class="sm">${e.phone?`<span class="mono">${esc(e.phone)}</span>`:"–"}</td>
    </tr>`}).join("");
  return `<div class="gridbox"><table class="ovt"><thead><tr><th>Mitarbeiter & Rollen</th><th>Vertrag</th><th>Stunden KW ${isoWeek(S.week).w}</th><th>Verfügbar</th><th>Grenzen</th><th>Schicht</th><th>Fähigkeiten</th><th>Abwesend</th><th>Telefon</th></tr></thead>
  <tbody>${rows}</tbody><tfoot><tr><td>Gesamt</td><td></td><td class="mono">${fmtH(tot.ist)} / ${fmtH(tot.soll)} h</td><td colspan="6"></td></tr></tfoot></table></div>
  <p class="muted" style="font-size:13px;margin-top:10px">Name antippen, um das Profil zu bearbeiten. Stunden und Schicht beziehen sich auf die oben gewählte Woche.</p>`;
}

      <select data-ab="${i}" data-k="kind" aria-label="Art" ${dis}>${["Urlaub","Schule/Prüfung","Frei-Wunsch","Sonstiges"].map(k=>`<option ${a.kind===k?"selected":""}>${k}</option>`).join("")}</select>${a.kind==="Urlaub"?`<select data-ab="${i}" data-k="status" aria-label="Status" ${dis}><option value="genehmigt" ${a.status!=="wunsch"?"selected":""}>genehmigt</option><option value="wunsch" ${a.status==="wunsch"?"selected":""}>Wunsch</option></select>`:""}<button class="btn ghost danger edit-only" data-abdel="${i}">Entfernen</button></div>`).join("")||`<p class="muted" style="margin:0">Nichts eingetragen.</p>`}
