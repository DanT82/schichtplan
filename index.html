    <div class="edit-only"><button class="btn danger" id="delEmp">${S.confirmDel===e.id?"Wirklich löschen? Schichten bleiben im Plan":"Mitarbeiter löschen"}</button></div>
  </div></div>`;
  $("#view").innerHTML=h;bindTeam();
}
function bindTeam(){
  const v=$("#view");
  collapsible(v,["Stammdaten","Vertrag & Stunden","Rollen"]);
  v.querySelectorAll("[data-tv]").forEach(b=>b.onclick=()=>{S.teamView=b.dataset.tv;render()});
  v.querySelectorAll("[data-emp]").forEach(b=>b.onclick=()=>{S.selEmp=b.dataset.emp;S.confirmDel=null;render()});
  const ae=$("#addEmp");if(ae)ae.onclick=addEmployee;
  const e=empById(S.selEmp);if(!e||S.ro)return;
  v.querySelectorAll("[data-f]").forEach(inp=>{
    const ev=inp.tagName==="SELECT"||inp.type==="checkbox"?"change":"input";
    inp.addEventListener(ev,()=>{const f=inp.dataset.f;e[f]=inp.dataset.bool!==undefined?inp.checked:inp.dataset.num!==undefined?(parseFloat(inp.value)||0):inp.value;saveCfg();
      if(f==="hue"){inp.style.accentColor=`hsl(${e.hue} 55% 50%)`;const b=v.querySelector(`[data-emp="${e.id}"]`);if(b)b.style.setProperty("--h",e.hue)}
      if(f==="name"||f==="role"||f==="monthHours"){const b=v.querySelector(`[data-emp="${e.id}"] span:last-child`);if(b)b.innerHTML=`${esc(e.name)}<small>${esc(ROLES[e.role])}${e.monthHours?` · ${e.monthHours} Std./Monat`:""}</small>`}});
  });
  const so=$("#sch_on");if(so)so.onchange=()=>{e.school={days:[],...(e.school||{}),on:so.checked};saveCfg();render()};
  v.querySelectorAll("[data-schd]").forEach(x=>x.onchange=()=>{const d=+x.dataset.schd;e.school.days=(e.school.days||[]).filter(y=>y!==d);if(x.checked)e.school.days.push(d);saveCfg();render()});
  const vo=$("#vac_on");if(vo)vo.onchange=()=>{if(!e.vacAvail){const days={};WD.forEach(d=>days[d]={on:true,from:S.cfg.settings.workStart,to:"21:15"});e.vacAvail={days}}e.vacAvail.on=vo.checked;saveCfg();render()};
  v.querySelectorAll("[data-vav]").forEach(inp=>inp.addEventListener("change",()=>{const d=inp.dataset.vav,k=inp.dataset.k;const t=e.vacAvail.days;t[d]=t[d]||{on:false,from:S.cfg.settings.workStart,to:"21:15"};t[d][k]=k==="on"?inp.checked:inp.value;saveCfg();if(k==="on")render()}));
  v.querySelectorAll("[data-av]").forEach(inp=>inp.addEventListener("change",()=>{const d=inp.dataset.av,k=inp.dataset.k;e.avail=e.avail||{};e.avail[d]=e.avail[d]||{on:false,from:S.cfg.settings.workStart,to:S.cfg.settings.workEnd};e.avail[d][k]=k==="on"?inp.checked:inp.value;saveCfg();if(k==="on")render()}));
  v.querySelectorAll("[data-kt]").forEach(x=>x.onchange=()=>{e.konto=e.konto||{hours:0,date:""};if(x.dataset.kt==="hours")e.konto.hours=parseFloat(x.value)||0;else e.konto.date=x.value?dkey(mondayOf(pdate(x.value))):"";if(e.konto.hours&&!e.konto.date)e.konto.date=dkey(S.week);saveCfg();render()});
  v.querySelectorAll("[data-fx]").forEach(x=>x.onchange=()=>{e.fixed[+x.dataset.fx][x.dataset.k]=x.value;saveCfg()});
  v.querySelectorAll("[data-fxd]").forEach(x=>x.onchange=()=>{const f=e.fixed[+x.dataset.fxd];const d=+x.value;f.days=(f.days||[]).filter(y=>y!==d);if(x.checked)f.days.push(d);f.days.sort();saveCfg()});
  v.querySelectorAll("[data-fxc]").forEach(x=>x.onchange=()=>{e.fixed[+x.dataset.fxc].coverLead=x.checked;saveCfg()});
  v.querySelectorAll("[data-fxdel]").forEach(b=>b.onclick=()=>{e.fixed.splice(+b.dataset.fxdel,1);saveCfg();render()});
  const fa=$("#fxAdd");if(fa)fa.onclick=()=>{e.fixed=e.fixed||[];e.fixed.push({days:[],from:"17:00",to:"21:00",task:defTask(e)});saveCfg();render()};
  const ro=$("#rot_on");if(ro)ro.onchange=()=>{e.rot={eFrom:"07:00",eTo:"15:30",lFrom:"13:15",lTo:"21:15",except:[],refMon:dkey(S.week),refEarly:true,...(e.rot||{}),on:ro.checked};saveCfg();render()};
  v.querySelectorAll("[data-rot]").forEach(x=>x.onchange=()=>{e.rot[x.dataset.rot]=x.value;saveCfg()});
  v.querySelectorAll("[data-rotex]").forEach(x=>x.onchange=()=>{const d=+x.dataset.rotex;e.rot.except=(e.rot.except||[]).filter(y=>y!==d);if(x.checked)e.rot.except.push(d);saveCfg()});
  const rs=$("#rot_swap");if(rs)rs.onclick=()=>{const cur=weekRotKind(e,S.week);e.rot.refMon=dkey(S.week);e.rot.refEarly=cur!=="frueh";saveCfg();render()};
  v.querySelectorAll("[data-skill]").forEach(inp=>inp.addEventListener("change",()=>{const id=inp.dataset.skill;e.skills=(e.skills||[]).filter(x=>x!==id);if(inp.checked)e.skills.push(id);saveCfg()}));
  v.querySelectorAll("[data-ab]").forEach(inp=>inp.addEventListener("change",()=>{e.absences[+inp.dataset.ab][inp.dataset.k]=inp.value;saveCfg();if(inp.dataset.k==="kind"||inp.dataset.k==="status")render()}));
  v.querySelectorAll("[data-abdel]").forEach(b=>b.onclick=()=>{e.absences.splice(+b.dataset.abdel,1);saveCfg();render()});
  const aa=$("#addAbs");if(aa)aa.onclick=()=>{e.absences=e.absences||[];const t=dkey(new Date());e.absences.push({from:t,to:t,kind:"Urlaub"});saveCfg();render()};
  const de=$("#delEmp");if(de)de.onclick=()=>{if(S.confirmDel!==e.id){S.confirmDel=e.id;render();return}S.cfg.employees=emps().filter(x=>x.id!==e.id);S.confirmDel=null;S.selEmp=null;saveCfg();render()};
}

function vacListHtml(y,iss){
  const ro=S.ro,dis=ro?"disabled":"";S.vacDraft=S.vacDraft||{};
  const a0=`${y}-01-01`,a1=`${y}-12-31`;
  const stSel=(attr,val)=>`<select ${attr} aria-label="Status" ${dis}><option value="genehmigt" ${val!=="wunsch"?"selected":""}>genehmigt</option><option value="wunsch" ${val==="wunsch"?"selected":""}>Wunsch</option></select>`;
  return `<div class="vlist">${vacGroups().map(g=>`<div class="vgrp">${esc(g.name)}</div>`+g.emps.map(e=>{
    const list=(e.absences||[]).map((a,i)=>({a,i})).filter(({a})=>isVac(a)&&a.from&&a.to&&a.to>=a0&&a.from<=a1).sort((x,z)=>x.a.from.localeCompare(z.a.from));
    const ent=+e.vacEntitle||0,left=vacLeft(e,y),sum=vacTaken(e,y,false)+vacTaken(e,y,true);
    const dr=S.vacDraft[e.id]||{};
    const rows=list.map(({a,i},n)=>{const is=iss.filter(x=>x.emps.includes(e.id)&&x.to>=a.from&&x.from<=a.to);const bad=is.some(x=>x.lv==="err");
      return `<tr class="${is.length?(bad?"vrbad":"vrwarn"):""}"><td class="mono muted">${n+1}</td>
        <td><input type="date" data-lv="${e.id}|${i}" data-k="from" value="${a.from}" aria-label="Von" ${dis}></td>
        <td><input type="date" data-lv="${e.id}|${i}" data-k="to" value="${a.to}" min="${a.from}" aria-label="Bis" ${dis}></td>
        <td class="mono">${vacDays(e,a.from,a.to)}</td><td>${stSel(`data-lv="${e.id}|${i}" data-k="status"`,a.status)}</td>
        <td><input type="text" data-lv="${e.id}|${i}" data-k="note" value="${esc(a.note||"")}" placeholder="Notiz" aria-label="Notiz" ${dis}></td>
        <td>${ro?"":`<button class="btn ghost danger" data-lvdel="${e.id}|${i}" aria-label="Zeile löschen">✕</button>`}</td></tr>
        ${is.length?`<tr class="vlinfo"><td></td><td colspan="6">${is.map(x=>`<span class="${x.lv}">● ${esc(x.msg)}</span>`).join("<br>")}</td></tr>`:""}`}).join("");
    const draft=ro?"":`<tr class="vdraft"><td class="mono muted">${list.length+1}</td>
        <td><input type="date" data-ld="${e.id}" data-k="from" value="${dr.from||""}" aria-label="Neuer Urlaub von"></td>
        <td><input type="date" data-ld="${e.id}" data-k="to" value="${dr.to||""}" min="${dr.from||""}" aria-label="Neuer Urlaub bis"></td>
        <td class="mono muted">${dr.from&&dr.to&&dr.from<=dr.to?vacDays(e,dr.from,dr.to):"–"}</td><td>${stSel(`data-ld="${e.id}" data-k="status"`,dr.status||"genehmigt")}</td>
        <td><input type="text" data-ld="${e.id}" data-k="note" value="${esc(dr.note||"")}" placeholder="neue Zeile" aria-label="Notiz"></td><td></td></tr>`;
    return `<div class="vlcard" style="--h:${e.hue}"><div class="vlhead"><span class="dot"></span><b>${esc(e.name)}</b><span class="muted sm">${sum} Tage eingetragen${ent?` · Anspruch ${ent}${vacRest(e,y)?` + ${vacRest(e,y)} Rest`:""} · <b class="${left<0?"neg":""}">${left} übrig</b>`:""}</span></div>
      <div class="ahwrap"><table class="aht vlt"><thead><tr><th>#</th><th>Von</th><th>Bis</th><th>Tage</th><th>Status</th><th>Notiz</th><th></th></tr></thead><tbody>${rows}${draft}</tbody></table></div></div>`}).join("")).join("")}
    ${ro?"":`<p class="muted sm">In die letzte Zeile Von und Bis eintragen, dann wird der Urlaub gespeichert und eine neue leere Zeile erscheint. Ist Von ein Montag, setzt die App Bis auf den Samstag (1 Woche); für mehr Wochen danach Bis ändern.</p>`}</div>`;

function bindVacList(v,y){
  if(S.ro)return;
  const fin=(e,a,old,isNew)=>{saveCfg();const iss=vacIssuesFor(e,a);let ws=[];
    if(old)ws=vacReplan(e,a,old);else if(isNew)ws=applyVac(e,a);
    S.vacMsg=`${e.name}: Urlaub ${fmtR(a.from,a.to)} (${vacWish(a)?"Wunsch":"genehmigt"}) ${isNew?"eingetragen":"geändert"}.`+(iss.length?` Info: ${iss.map(i=>i.msg).join(" ")}`:"")+(ws.length?` Schichtplan neu geplant: ${ws.join(", ")}.`:"");render()};
  v.querySelectorAll("[data-lv]").forEach(inp=>inp.onchange=()=>{
    const [id,i]=inp.dataset.lv.split("|");const e=empById(id),a=e.absences[+i];const k=inp.dataset.k;
    if(k==="note"){if(inp.value)a.note=inp.value;else delete a.note;saveCfg();return}
    const old={from:a.from,to:a.to,status:a.status};
    if(k==="status"){a.status=inp.value;saveCfg();const wasW=old.status==="wunsch";
      let ws=[];if(wasW&&!vacWish(a))ws=applyVac(e,a);else if(!wasW&&vacWish(a))ws=vacReplan(e,a,old,true);
      S.vacMsg=`${e.name}: ${fmtR(a.from,a.to)} ist jetzt ${vacWish(a)?"Wunsch":"genehmigt"}.`+(ws.length?` Schichtplan neu geplant: ${ws.join(", ")}.`:"");render();return}
    if(!inp.value){render();return}
    a[k]=inp.value;if(a.to<a.from){if(k==="from")a.to=a.from;else a.from=a.to}
    fin(e,a,vacWish(a)?null:old,false)});
  v.querySelectorAll("[data-lvdel]").forEach(b=>b.onclick=()=>{
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Löschen?";return}
    const [id,i]=b.dataset.lvdel.split("|");const e=empById(id),a=e.absences[+i];e.absences.splice(+i,1);saveCfg();
    let ws=[];if(!vacWish(a))ws=vacReplan(e,{...a,status:"wunsch"},{from:a.from,to:a.to},true);
    S.vacMsg=`${e.name}: Urlaub ${fmtR(a.from,a.to)} gelöscht.`+(ws.length?` Schichtplan neu geplant: ${ws.join(", ")}.`:"");render()});
  v.querySelectorAll("[data-ld]").forEach(inp=>{const ev=inp.type==="text"?"input":"change";inp.addEventListener(ev,()=>{
    const id=inp.dataset.ld,k=inp.dataset.k;const d=S.vacDraft[id]=S.vacDraft[id]||{status:"genehmigt"};d[k]=inp.value;
    if(k==="note")return;
    if(k==="from"&&d.from&&(!d.to||d.to<d.from)){const f=pdate(d.from);d.to=f.getDay()===1?dkey(addDays(f,5)):""}
    if(d.from&&d.to&&d.from<=d.to){const e=empById(id);e.absences=e.absences||[];const rec={from:d.from,to:d.to,kind:"Urlaub",status:d.status||"genehmigt"};if(d.note)rec.note=d.note;e.absences.push(rec);delete S.vacDraft[id];fin(e,rec,null,true)}
    else if(k!=="status")render()})});
}

function openVac(e,i,preset){
  const ro=S.ro;const isNew=!e||i<0;
  const a0=!isNew?e.absences[i]:null;

const HBW=[278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,333,333,584,584,584,611,975,722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,333,278,333,584,556,333,556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,389,280,389,584];
const WIN={"€":128,"‚":130,"„":132,"…":133,"•":149,"–":150,"—":151,"“":147,"”":148,"‘":145,"’":146};
function winCode(ch){if(WIN[ch])return WIN[ch];const c=ch.charCodeAt(0);return c<256?c:63}
function tw(str,size,bold){const W=bold?HBW:HW;let w=0;for(const ch of str){const c=winCode(ch);let b=c>=32&&c<=126?W[c-32]:(ch==="ä"||ch==="ö"||ch==="ü")?556:(ch==="Ä"||ch==="Ö"||ch==="Ü")?722:ch==="ß"?(bold?611:611):ch==="–"?556:556;w+=b}return w*size/1000}
function fit(str,size,bold,max){if(tw(str,size,bold)<=max)return str;let s=str;while(s.length>1&&tw(s+"…",size,bold)>max)s=s.slice(0,-1);return s+"…"}
function pdfStr(s){let o="";for(const ch of s){const c=winCode(ch);const x=String.fromCharCode(c);o+=(x==="("||x===")"||x==="\\")?"\\"+x:x}return "("+o+")"}
function makePdf(draw,W0,H0){
  const W=W0||841.89,H=H0||595.28;const ops=[];const n=v=>(+v).toFixed(2);
  const g={
    W,H,
    fill(c){ops.push(`${n(c[0])} ${n(c[1])} ${n(c[2])} rg`)},stroke(c){ops.push(`${n(c[0])} ${n(c[1])} ${n(c[2])} RG`)},
    lw(w){ops.push(`${n(w)} w`)},
    rect(x,y,w,h,mode){ops.push(`${n(x)} ${n(H-y-h)} ${n(w)} ${n(h)} re ${mode||"f"}`)},
    line(x1,y1,x2,y2){ops.push(`${n(x1)} ${n(H-y1)} m ${n(x2)} ${n(H-y2)} l S`)},
    hatch(x,y,w,h,c,gap,lw){ops.push("q",`${n(x)} ${n(H-y-h)} ${n(w)} ${n(h)} re W n`,`${n(c[0])} ${n(c[1])} ${n(c[2])} RG`,`${n(lw||.6)} w`);for(let t=-h;t<w;t+=gap||4)ops.push(`${n(x+t)} ${n(H-y-h)} m ${n(x+t+h)} ${n(H-y)} l S`);ops.push("Q")},
    text(x,y,s,size,bold,color){ops.push(`BT ${color?`${n(color[0])} ${n(color[1])} ${n(color[2])} rg `:""}/${bold?"F2":"F1"} ${n(size)} Tf ${n(x)} ${n(H-y)} Td ${pdfStr(s)} Tj ET`)},
  };
  draw(g);
  const content=ops.join("\n");
  const objs=[
    "<< /Type /Catalog /Pages 2 0 R >>",
    "<< /Type /Pages /Kids [3 0 R] /Count 1 >>",
    `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${n(W)} ${n(H)}] /Resources << /Font << /F1 5 0 R /F2 6 0 R >> >> /Contents 4 0 R >>`,
    `<< /Length ${content.length} >>\nstream\n${content}\nendstream`,
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
    "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>",
  ];
  let out="%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";const offs=[];
  objs.forEach((o,i)=>{offs.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});
  const x=out.length;
  out+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`+offs.map(o=>String(o).padStart(10,"0")+" 00000 n \n").join("");
  out+=`trailer\n<< /Size ${objs.length+1} /Root 1 0 R >>\nstartxref\n${x}\n%%EOF`;
  const b=new Uint8Array(out.length);for(let i=0;i<out.length;i++)b[i]=out.charCodeAt(i)&255;return b;
}
function buildWeekPdf(){
  const wid=curWid(),shifts=weekShifts(wid),dates=weekDates();
  const C={ink:[.09,.13,.11],muted:[.38,.42,.40],line:[.78,.81,.79],head:[.91,.93,.92],zebra:[.97,.975,.97],closed:[.93,.91,.96],grid:[.45,.48,.46],red:[.72,.22,.16],acc:[.11,.35,.43]};
  return makePdf(g=>{
    const M=28,top=28;const mon=S.week,sat=addDays(mon,5),{w}=isoWeek(mon);
    g.text(M,top+14,"Schichtplan Getränkeabteilung",17,true,C.ink);
    const rng=`KW ${w}  ·  ${mon.toLocaleDateString("de-DE")} – ${sat.toLocaleDateString("de-DE")}`;
    g.text(g.W-M-tw(rng,13,true),top+14,rng,13,true,C.ink);
    const fer=[...new Set(dates.map(ferienOn).filter(Boolean).map(v=>v.name))];
    const sub=(fer.length?"Schulferien: "+fer.join(", ")+"   ·   ":"")+"Stand: "+new Date().toLocaleDateString("de-DE")+" "+new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
    g.text(M,top+30,sub,8.5,false,C.muted);
    const nameW=128,hrsW=54,dayW=(g.W-2*M-nameW-hrsW)/6;const x0=M,y0=top+42;
    const colX=i=>x0+nameW+i*dayW;
    // header lines
    const headLines=dates.map(k=>{const di=dayInfo(k);const L=[];
      if(di.type==="geschlossen")L.push({t:di.hol||"geschlossen",c:C.red,b:true});
      else{{const dw=dayWindow(k);if(dw.special)L.push({t:"Geöffnet "+dw.open+"–"+dw.close,c:C.red,b:true})}if(di.type==="vorFeiertag")L.push({t:"Vor Feiertag",c:C.red,b:true});if(di.override?.note)L.push({t:di.override.note,c:C.acc,b:true});
        dayTasks(k,shifts).forEach(x=>{L.push({t:(x.done?"[x] ":"[  ] ")+x.t.label+(x.t.time?" bis "+x.t.time:""),c:x.ok?C.ink:C.red,b:true});const nm=x.doer?x.doer.name+(x.level>0?" (Vertretung)":""):x.who.length&&!x.chain.length?x.who.join(", "):(x.t.skill||x.chain.length)?"niemand da":"";if(nm)L.push({t:"     "+nm,c:x.ok?C.muted:C.red,b:!x.ok})});}
      return L});
    const hh=26+Math.max(0,...headLines.map(l=>l.length))*9.5;
    // rows
    const rows=emps().map(e=>{const cells=dates.map(k=>{const di=dayInfo(k);if(di.type==="geschlossen")return {closed:true,L:[]};
        const mine=shifts.filter(s=>s.empId===e.id&&s.date===k).sort((a,b)=>toMin(a.from)-toMin(b.from));const L=[];
        mine.forEach(s=>{if(s.sub)L.push({t:`+ ${s.from}–${s.to} ${taskLabel(s)}`,sz:7.5,c:C.muted});else{L.push({t:`${s.from}–${s.to}`,sz:9.5,b:true});L.push({t:taskLabel(s)+(s.autoLead?" (Vertretung)":""),sz:7.5,c:C.muted})}});
        const ab=absentOn(e,k);if(!mine.length&&ab)L.push({t:ab.kind||"abwesend",sz:8.5,c:C.red});
        if(!mine.length&&coveredNote(e,k,shifts))L.push({t:"Leergut besetzt",sz:8,c:C.muted});
        if(schoolOn(e,k))L.push({t:"Schule",sz:8,c:C.acc,b:true});
        return {L}});
      const wm=weekMinutes(e.id,wid),t=weekTarget(e);
      return {e,cells,hrs:`${fmtH(wm)}${t?" / "+fmtH(t):""}`,lines:Math.max(2,...cells.map(c=>c.L.reduce((a,l)=>a+(l.sz>=9?1.15:1),0)))}});
    const avail=g.H-28-18-y0-hh-20;let lh=10.5;const need=rows.reduce((a,r)=>a+r.lines*lh+8,0);const sc=Math.min(1.35,avail/need);lh*=sc;
    // header bg
    g.fill(C.head);g.rect(x0,y0,g.W-2*M,hh);
    g.text(x0+6,y0+15,"Mitarbeiter",8,true,C.muted);g.text(colX(6)+6,y0+15,"Std.",8,true,C.muted);g.text(colX(6)+6,y0+24,"Ist / Soll",6.5,false,C.muted);
    dates.forEach((k,i)=>{const d=pdate(k);const x=colX(i);if(dayInfo(k).type==="geschlossen"){g.fill(C.closed);g.rect(x,y0,dayW,hh)}
      g.text(x+6,y0+15,DNL[d.getDay()],11,true,C.ink);g.text(x+6+tw(DNL[d.getDay()],11,true)+5,y0+15,shortD(k),8.5,false,C.muted);
      headLines[i].forEach((l,j)=>g.text(x+6,y0+28+j*9.5,fit(l.t,7.3,l.b,dayW-10),7.3,l.b,l.c))});
    let y=y0+hh;const rowY=[];
    rows.forEach((r,ri)=>{const rh=r.lines*lh+8;
      if(ri%2)g.fill(C.zebra),g.rect(x0,y,g.W-2*M,rh);
      dates.forEach((k,i)=>{if(r.cells[i].closed){g.fill(C.closed);g.rect(colX(i),y,dayW,rh)}});
      g.text(x0+6,y+12*Math.max(sc,.8),fit(r.e.name,10*Math.max(sc,.85),true,nameW-10),10*Math.max(sc,.85),true,C.ink);
      g.text(x0+6,y+22*Math.max(sc,.8),fit(ROLES[r.e.role]||"",7.3,false,nameW-10),7.3,false,C.muted);
      r.cells.forEach((c,i)=>{let yy=y+4;c.L.forEach(l=>{const step=(l.sz>=9?1.15:1)*lh;yy+=step;g.text(colX(i)+6,yy-2,fit(l.t,l.sz*Math.max(sc,.85),!!l.b,dayW-10),l.sz*Math.max(sc,.85),!!l.b,l.c||C.ink)})});
      g.text(colX(6)+6,y+12*Math.max(sc,.8),r.hrs,8.5,false,C.ink);
      y+=rh;rowY.push(y);});
    // totals
    g.fill(C.head);g.rect(x0,y,g.W-2*M,18);
    g.text(x0+6,y+12,"Stunden gesamt",8.5,true,C.ink);
    let ist=0,soll=0;dates.forEach((k,i)=>{const m=shifts.filter(s=>s.date===k).reduce((a,s)=>a+dur(s),0);ist+=m;g.text(colX(i)+6,y+12,fmtH(m)+" h",8.5,true,C.ink)});
    emps().forEach(e=>soll+=weekTarget(e));g.text(colX(6)+6,y+12,`${fmtH(ist)} / ${fmtH(soll)}`,8.5,true,C.ink);
    // grid
    g.stroke(C.grid);g.lw(.8);
    rowY.forEach(yy=>g.line(x0,yy,g.W-M,yy));
    for(let i=1;i<6;i++)g.line(colX(i),y0,colX(i),y+18);
    g.stroke(C.ink);g.lw(1.4);
    g.rect(x0,y0,g.W-2*M,y+18-y0,"S");
    g.line(x0,y0+hh,g.W-M,y0+hh);
    g.line(colX(0),y0,colX(0),y+18);g.line(colX(6),y0,colX(6),y+18);
    g.text(M,g.H-18,"Zeiten inkl. Pause. Stunden = reine Arbeitszeit. „+“ = kurzer Einsatz in anderer Rolle innerhalb der Schicht.",7,false,C.muted);
  });
}
async function exportPdf(btn){
  const {w}=isoWeek(S.week);
  try{btn.disabled=true;await shareFile(new Blob([buildWeekPdf()],{type:"application/pdf"}),`Schichtplan_KW${w}_${S.week.getFullYear()}.pdf`)}
  catch(e){showNotice("PDF konnte nicht erstellt werden: "+(e.message||e))}
  finally{btn.disabled=false}
}
